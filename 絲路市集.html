<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>絲路市集</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --char-size: 250px;
            --sand: #e7c99a;
            --cream: #fff8ea;
            --indigo: #1b3a4b;
            --gold: #c6a15b;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            color: var(--indigo);
        }

        #bg-layer {
            position: absolute; inset: 0;
            background-color: var(--sand);
            background-image: url("Gemini_Generated_Image_jt5ftfjt5ftfjt5f.jpeg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        #showUiBtn {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            padding: 12px 20px; font-size: 18px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 15px; color: var(--cream); background-color: #0e6b5c;
            box-shadow: 0 6px 0 #08483e; font-family: inherit;
        }
        #showUiBtn:active { transform: translateY(6px); box-shadow: 0 0 0 #08483e; }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 248, 234, 0.96);
            padding: 18px 20px; border-radius: 18px;
            border: 4px solid var(--indigo);
            box-shadow: 0 0 0 4px var(--gold);
            width: min(380px, calc(100vw - 40px));
            max-height: calc(100vh - 40px);
            overflow: auto;
            box-sizing: border-box;
        }
        #ui-layer.hidden { display: none; }

        .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        h1 { margin: 0; font-size: 26px; color: #7a2e12; }
        .close-btn {
            background: none; border: none; font-size: 24px; color: #9a6b2f;
            cursor: pointer; padding: 0; font-family: inherit;
        }
        .status { margin: 8px 0 12px; font-weight: bold; line-height: 1.45; }
        .status small { display: block; font-weight: normal; color: #7a2e12; }

        .control-panel {
            margin-bottom: 12px; padding: 12px; background: #fff;
            border-radius: 14px; border: 2px dashed var(--gold);
        }
        .control-panel label { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 6px; }
        .control-panel input[type="range"] { width: 100%; margin: 0 0 12px; }
        .control-panel input[type="range"]:last-child { margin-bottom: 0; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; }
        button.action-btn {
            padding: 12px 10px; font-size: 16px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 14px; color: var(--cream);
            flex: 1; font-family: inherit;
        }
        .btn-blue { background: #243e73; box-shadow: 0 5px 0 #15284d; }
        .btn-green { background: #0e6b5c; box-shadow: 0 5px 0 #08483e; }
        .btn-red { background: #b5522a; box-shadow: 0 5px 0 #7a3018; }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        #roster { margin-top: 10px; }
        #roster[hidden] { display: none; }
        #roster-list {
            max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            overscroll-behavior: contain;
        }
        .roster-empty { margin: 0; font-weight: bold; color: #7a2e12; }
        .roster-row {
            display: grid; grid-template-columns: 72px 1fr auto; gap: 8px; align-items: center;
            width: 100%; box-sizing: border-box; text-align: left;
            background: #fff; border: 2px solid var(--gold); border-radius: 12px;
            padding: 6px; font-family: inherit; font-weight: bold; color: var(--indigo); cursor: pointer;
        }
        .roster-row img {
            width: 72px; height: 54px; object-fit: contain; background: #f3e2c0; border-radius: 8px;
        }
        .roster-row span { min-width: 0; line-height: 1.3; }
        .roster-remove {
            background: #b5522a; color: var(--cream); border-radius: 10px; padding: 8px 10px; font-size: 14px;
        }

        #wall { position: absolute; inset: 0; z-index: 2; overflow: visible; pointer-events: none; }

        .character {
            position: absolute;
            left: 0; top: 0;
            width: var(--char-size);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            will-change: transform;
        }
        .character img { width: 100%; height: auto; display: block; }
        .goods-tag {
            order: -1;
            margin-bottom: 4px;
            background: var(--indigo);
            color: var(--cream);
            border: 2px solid var(--gold);
            border-radius: 999px;
            padding: 3px 10px;
            font-weight: bold;
            font-size: clamp(14px, calc(var(--char-size) * 0.07), 28px);
            white-space: nowrap;
            line-height: 1.3;
        }
        .goods-tag.silk { background: #7a1e32; }
        .goods-tag.paper { background: #8a6232; }
        .goods-tag.spice { background: #a34a28; }
        .goods-tag.glass { background: #0e6b5c; }

        #trade-board {
            position: absolute; top: 12px; right: 12px; z-index: 20;
            width: min(196px, calc(100vw - 24px));
            box-sizing: border-box;
            background: rgba(255, 248, 234, 0.94);
            border: 3px solid var(--indigo);
            box-shadow: 0 0 0 3px var(--gold);
            border-radius: 14px;
            padding: 7px 8px 6px;
            pointer-events: none;
        }
        #trade-board h2 { margin: 0 0 4px; font-size: 15px; color: #7a2e12; text-align: center; }
        #trade-board ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
        #trade-board li {
            display: grid; grid-template-columns: 8px 1fr auto auto; gap: 5px; align-items: center;
            background: #fff; border-radius: 8px; padding: 2px 6px; font-weight: bold; font-size: 13px;
        }
        #trade-board b { font-size: 16px; min-width: 1.2em; text-align: right; color: #7a2e12; }
        #trade-board b.bump { animation: trade-bump 0.35s ease; }
        #trade-board small { font-size: 11px; color: #7a2e12; }
        .trade-dot { width: 8px; height: 8px; border-radius: 50%; display: block; }
        .trade-dot.silk { background: #7a1e32; }
        .trade-dot.paper { background: #8a6232; }
        .trade-dot.spice { background: #a34a28; }
        .trade-dot.glass { background: #0e6b5c; }
        #trade-board p { margin: 5px 0 0; font-size: 11px; font-weight: bold; line-height: 1.3; color: #7a2e12; }
        @keyframes trade-bump { 50% { transform: scale(1.25); } }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="wall"></div>

    <aside id="trade-board">
        <h2>絲路貿易榜</h2>
        <ul>
            <li><i class="trade-dot silk"></i><span>絲綢</span><b id="trade-silk">0</b><small>筆</small></li>
            <li><i class="trade-dot paper"></i><span>紙</span><b id="trade-paper">0</b><small>筆</small></li>
            <li><i class="trade-dot spice"></i><span>香料</span><b id="trade-spice">0</b><small>筆</small></li>
            <li><i class="trade-dot glass"></i><span>玻璃</span><b id="trade-glass">0</b><small>筆</small></li>
        </ul>
        <p>東西帶到缺少它的地方，就有人要。兩個方向都賺到。</p>
    </aside>

    <button id="showUiBtn" onclick="toggleUI(true)" hidden>打開市集面板</button>

    <div id="ui-layer">
        <div class="header-row">
            <h1>絲路市集</h1>
            <button class="close-btn" onclick="toggleUI(false)" title="隱藏面板">✖</button>
        </div>
        <p class="status">
            電視上 <span id="char-count">0</span> 位，雲端共 <span id="cloud-count">0</span> 位
            <small>絲綢和紙從東方（右邊）走來，香料和玻璃從西方（左邊）走來。亂畫的角色可在名單裡點移除。</small>
        </p>

        <div class="control-panel">
            <label for="limitSlider">這部電視最多顯示：<span id="limitValue">50</span> 位</label>
            <input type="range" id="limitSlider" min="5" max="100" value="50" step="1">

            <label for="sizeSlider">旅人大小：<span id="sizeValue">250px</span></label>
            <input type="range" id="sizeSlider" min="100" max="600" value="250" step="10">
        </div>

        <div class="btn-group">
            <div class="row">
                <input type="file" id="gifInput" accept="image/gif" multiple hidden>
                <input type="file" id="bgInput" accept="image/*" hidden>
                <button class="action-btn btn-blue" onclick="document.getElementById('gifInput').click()">加自己的圖</button>
                <button class="action-btn btn-green" onclick="document.getElementById('bgInput').click()">換背景</button>
            </div>
            <button id="btnRoster" class="action-btn btn-blue" type="button" onclick="toggleRoster()">查看旅人名單</button>
            <div id="roster" hidden>
                <div id="roster-list"></div>
            </div>
            <button id="btnClear" class="action-btn btn-red" onclick="clearWall()">清空雲端旅人</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDa5PUoGfTswgqQFChKC0xt-Rv21G9FYuw",
            authDomain: "character-wall.firebaseapp.com",
            databaseURL: "https://character-wall-default-rtdb.firebaseio.com",
            projectId: "character-wall",
            storageBucket: "character-wall.firebasestorage.app",
            messagingSenderId: "308216615534",
            appId: "1:308216615534:web:fed9146e0e4f2303c5cc7f",
            measurementId: "G-4SV49ZQEB3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const GOODS = {
            silk:  { name: '絲綢', from: '東方', direction: 'east' },
            paper: { name: '紙', from: '東方', direction: 'east' },
            spice: { name: '香料', from: '西方', direction: 'west' },
            glass: { name: '玻璃', from: '西方', direction: 'west' }
        };
        const TRADE_KEY = 'silk-road-trade';
        const TRADE_ITEMS = ['silk', 'paper', 'spice', 'glass'];
        let tradeCounts = { silk: 0, paper: 0, spice: 0, glass: 0 };

        const wall = document.getElementById('wall');
        const countText = document.getElementById('char-count');
        const cloudCountText = document.getElementById('cloud-count');
        let charactersList = [];
        let rosterRecords = [];
        let rosterOpen = false;
        let maxCharactersLimit = 50;
        let clearArmed = false;

        function hashId(id) {
            let h = 0;
            for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
            return h;
        }

        function directionOf(record) {
            if (record.direction === 'east' || record.direction === 'west') return record.direction;
            if (GOODS[record.item]) return GOODS[record.item].direction;
            return hashId(record.id) % 2 === 0 ? 'east' : 'west';
        }

        function toggleUI(show) {
            document.getElementById('ui-layer').classList.toggle('hidden', !show);
            document.getElementById('showUiBtn').hidden = show;
        }

        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            const newSize = e.target.value + 'px';
            document.getElementById('sizeValue').textContent = newSize;
            document.documentElement.style.setProperty('--char-size', newSize);
            charactersList.forEach((char) => char.placeOnRoad());
        });

        document.getElementById('limitSlider').addEventListener('input', (e) => {
            maxCharactersLimit = parseInt(e.target.value, 10);
            document.getElementById('limitValue').textContent = maxCharactersLimit;
            db.ref('characters').once('value', (snapshot) => processCloudData(snapshot.val()));
        });

        function loadTrade() {
            try {
                const saved = JSON.parse(localStorage.getItem(TRADE_KEY) || '{}');
                TRADE_ITEMS.forEach((key) => {
                    const n = parseInt(saved[key], 10);
                    if (n > 0) tradeCounts[key] = n;
                });
            } catch (err) {}
            renderTrade();
        }

        function renderTrade(flash) {
            TRADE_ITEMS.forEach((key) => {
                const el = document.getElementById('trade-' + key);
                el.textContent = tradeCounts[key];
                if (flash === key) {
                    el.classList.remove('bump');
                    void el.offsetWidth;
                    el.classList.add('bump');
                }
            });
        }

        function addTrade(item) {
            if (!GOODS[item]) return;
            tradeCounts[item] += 1;
            localStorage.setItem(TRADE_KEY, JSON.stringify(tradeCounts));
            renderTrade(item);
        }

        function resetTrade() {
            tradeCounts = { silk: 0, paper: 0, spice: 0, glass: 0 };
            localStorage.removeItem(TRADE_KEY);
            renderTrade();
        }

        class MovingCharacter {
            constructor(record) {
                this.id = record.id;
                this.item = GOODS[record.item] ? record.item : '';
                this.direction = directionOf(record);
                this.footRatio = 0.50 + (hashId(this.id) % 201) / 1000;
                this.speed = this.randomSpeed();
                this.element = document.createElement('div');
                this.element.className = 'character';
                this.element.style.zIndex = String(Math.round(this.footRatio * 100));

                const goods = GOODS[record.item];
                if (goods || record.itemName) {
                    const tag = document.createElement('div');
                    tag.className = 'goods-tag' + (record.item ? ' ' + record.item : '');
                    tag.textContent = goods ? `${goods.name} · 來自${goods.from}` : record.itemName;
                    this.element.appendChild(tag);
                }

                this.img = document.createElement('img');
                this.img.src = record.data;
                this.img.alt = goods ? goods.name : '旅人';
                this.img.onload = () => this.placeOnRoad();
                this.element.appendChild(this.img);

                const spread = window.innerWidth + 700;
                this.x = (hashId(record.id) % spread) - 250;
                this.vx = this.direction === 'east' ? -this.speed : this.speed;
                this.y = 0;
                this.wasVisible = this.x > -250 && this.x < window.innerWidth;
                this.placeOnRoad();

                this.element.addEventListener('click', () => {
                    db.ref('characters/' + this.id).remove();
                });
                wall.appendChild(this.element);
            }

            randomSpeed() {
                return 0.65 + Math.random() * 2.9;
            }

            placeOnRoad() {
                const height = this.element.offsetHeight || 220;
                const foot = window.innerHeight * this.footRatio;
                this.y = foot - height;
            }

            update() {
                this.x += this.vx;
                const width = this.element.offsetWidth || 250;
                const visible = this.x > -width && this.x < window.innerWidth;
                if (this.wasVisible && !visible && this.item) {
                    addTrade(this.item);
                    this.speed = this.randomSpeed();
                }
                this.wasVisible = visible;
                if (this.x > window.innerWidth) this.vx = -Math.abs(this.speed);
                if (this.x < -width) this.vx = Math.abs(this.speed);
                this.placeOnRoad();
                this.img.style.transform = `scaleX(${this.vx >= 0 ? 1 : -1})`;
                this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
            }
        }

        function processCloudData(data) {
            let cloudGifs = [];
            if (data) {
                for (let key in data) {
                    const row = data[key] || {};
                    if (!row.data) continue;
                    cloudGifs.push({
                        id: key,
                        data: row.data,
                        timestamp: row.timestamp || 0,
                        item: row.item || '',
                        itemName: row.itemName || '',
                        direction: row.direction || ''
                    });
                }
                cloudGifs.sort((a, b) => a.timestamp - b.timestamp);
            }

            cloudCountText.textContent = cloudGifs.length;
            rosterRecords = cloudGifs.slice().reverse();
            const visibleGifs = cloudGifs.length > maxCharactersLimit
                ? cloudGifs.slice(cloudGifs.length - maxCharactersLimit)
                : cloudGifs;

            const activeIds = new Set(visibleGifs.map((g) => g.id));
            for (let i = charactersList.length - 1; i >= 0; i--) {
                if (!activeIds.has(charactersList[i].id)) {
                    charactersList[i].element.remove();
                    charactersList.splice(i, 1);
                }
            }

            const renderedIds = new Set(charactersList.map((c) => c.id));
            visibleGifs.forEach((record) => {
                if (!renderedIds.has(record.id)) charactersList.push(new MovingCharacter(record));
            });
            countText.textContent = charactersList.length;
            if (rosterOpen) renderRoster();
        }

        function toggleRoster() {
            rosterOpen = !rosterOpen;
            document.getElementById('roster').hidden = !rosterOpen;
            document.getElementById('btnRoster').textContent = rosterOpen ? '收起旅人名單' : '查看旅人名單';
            if (rosterOpen) renderRoster();
        }

        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.replaceChildren();
            if (!rosterRecords.length) {
                const empty = document.createElement('p');
                empty.className = 'roster-empty';
                empty.textContent = '現在沒有旅人。';
                list.appendChild(empty);
                return;
            }
            const shown = new Set(charactersList.map((c) => c.id));
            rosterRecords.forEach((record) => {
                const goods = GOODS[record.item];
                const name = goods ? `${goods.name} · 來自${goods.from}` : (record.itemName || '未標貨物');
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'roster-row';
                const img = document.createElement('img');
                img.src = record.data;
                img.alt = name;
                const label = document.createElement('span');
                label.textContent = shown.has(record.id) ? name : `${name}（未顯示）`;
                const remove = document.createElement('span');
                remove.className = 'roster-remove';
                remove.textContent = '移除';
                row.append(img, label, remove);
                row.onclick = () => db.ref('characters/' + record.id).remove();
                list.appendChild(row);
            });
        }

        db.ref('characters').on('value', (snapshot) => {
            processCloudData(snapshot.val());
        });

        function clearWall() {
            const btn = document.getElementById('btnClear');
            if (!clearArmed) {
                clearArmed = true;
                btn.textContent = '再按一次，才清空雲端';
                setTimeout(() => {
                    clearArmed = false;
                    btn.textContent = '清空雲端旅人';
                }, 3000);
                return;
            }
            clearArmed = false;
            btn.textContent = '清空雲端旅人';
            resetTrade();
            db.ref('characters').remove();
        }

        document.getElementById('gifInput').addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || !files.length) return;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    db.ref('characters').push({
                        data: event.target.result,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        });

        document.getElementById('bgInput').addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('bg-layer').style.backgroundImage = `url('${event.target.result}')`;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        loadTrade();

        function animate() {
            charactersList.forEach((char) => char.update());
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
